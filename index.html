<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PackNStir | Premium Eco-Conscious Packaging & Sustainable Tableware</title>
  <meta name="description" content="PackNStir - Bespoke zero-plastic paper and cardboard packaging engineered for modern food, retail, luxury, and e-commerce brands. 100% curbside recyclable & compostable.">

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📦</text></svg>">

  <!-- Google Fonts: Plus Jakarta Sans & Playfair Display -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;0,700;0,800;1,500;1,600&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Tailwind CSS CDN with Custom Palette Configuration -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Plus Jakarta Sans"', 'sans-serif'],
            serif: ['"Playfair Display"', 'Georgia', 'serif'],
            mono: ['"JetBrains Mono"', 'monospace'],
          },
          colors: {
            forest: {
              50: '#F0F6F2',
              100: '#DCECE2',
              200: '#BCDEC8',
              300: '#91C8A6',
              400: '#64AC82',
              500: '#439064',
              600: '#32744F',
              700: '#285D40',
              800: '#234A35',
              900: '#1A382B',
              950: '#0E1F18',
            },
            kraft: {
              50: '#FBF8F3',
              100: '#F6EFE3',
              200: '#EBDDC8',
              300: '#DEC6A6',
              400: '#CCA87D',
              500: '#C29B70',
              600: '#A67C52',
              700: '#8A623E',
              800: '#714F33',
              900: '#5C402B',
            },
            cream: {
              50: '#FDFCF9',
              100: '#FAF8F5',
              200: '#F4EFE6',
              300: '#ECE4D4',
              400: '#DFD3BE',
              500: '#CFC0A4',
            }
          }
        }
      }
    }
  </script>

  <!-- GSAP (GreenSock) for high-end scroll animations & UI transitions -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

  <style>
    /* Custom Luxury & Paper Aesthetics */
    body {
      background-color: #FFFFFF;
      color: #1F2421;
      font-feature-settings: 'cv02', 'cv03', 'cv04', 'cv11';
    }

    /* Subtle kraft fiber texture overlay on subtle sections */
    .kraft-texture {
      background-image: radial-gradient(#C49A6C 0.6px, transparent 0.6px);
      background-size: 14px 14px;
    }

    /* Custom elegant scrollbar */
    ::-webkit-scrollbar {
      width: 7px;
      height: 7px;
    }
    ::-webkit-scrollbar-track {
      background: #F4EFE6;
    }
    ::-webkit-scrollbar-thumb {
      background: #C49A6C;
      border-radius: 4px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #1A382B;
    }

    /* Print styles for downloadable receipts */
    @media print {
      header, footer, #cart-drawer-root, #quickview-modal-root, button:not(#btn-print-receipt) {
        display: none !important;
      }
      #checkout-modal-backdrop {
        position: static !important;
        background: white !important;
        opacity: 1 !important;
        padding: 0 !important;
      }
      #checkout-modal-container {
        border: none !important;
        box-shadow: none !important;
        width: 100% !important;
        max-width: 100% !important;
      }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col font-sans antialiased text-stone-900 selection:bg-emerald-800 selection:text-white">
  
  <div id="app" class="flex flex-col min-h-screen">
    <!-- Main Application Injected by JavaScript -->
    <div class="h-screen flex items-center justify-center">
      <div class="flex items-center gap-3 text-emerald-900 font-bold text-sm">
        <svg class="w-6 h-6 animate-spin" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
        <span>Loading PackNStir...</span>
      </div>
    </div>
  </div>

  <!-- Application Script (Bundled for seamless local file:// and HTTP server execution) -->
  <script src="./dist/app.bundle.js"></script>
</body>
</html>
